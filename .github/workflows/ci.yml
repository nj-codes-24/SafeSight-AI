name: CI

# Lint and CPU tests on a clean Windows runner. The trained weights, datasets and demo footage are not in the
# repository, so tests/test_pipeline.py skips itself here (each skip prints its reason). Those integration tests
# are run locally where the weights and data are available.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (Windows, Python 3.11, CPU)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Byte-compile all sources
        run: python -m compileall -q app inference intelligence runtime database training watchdog_svc scripts tests launch.py

      - name: Tests (unit tests, watchdog drills; integration tests skip without weights)
        run: python -m pytest -rs
